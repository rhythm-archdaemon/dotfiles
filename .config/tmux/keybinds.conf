# ============================================================
# PREFIX
# ============================================================
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ============================================================
# SPLITS & WINDOWS
# ============================================================
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"   # vertical split, same dir
bind - split-window -v -c "#{pane_current_path}"   # horizontal split, same dir
bind c new-window -c "#{pane_current_path}"        # new window, same dir

# ============================================================
# PANE NAVIGATION & RESIZE (vim-style)
# ============================================================
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Restore C-l clear screen under prefix
bind C-l send-keys 'C-l'

# ============================================================
# WINDOW NAVIGATION
# ============================================================
bind -n M-h  previous-window   # Alt+Left
bind -n M-l next-window       # Alt+Right

# ============================================================
# RENAMING
# ============================================================
bind r command-prompt -I "#W" "rename-window '%%'"
bind R command-prompt -I "#S" "rename-session '%%'"

# ============================================================
# COPY MODE (vi-style)
# ============================================================
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi y      send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
