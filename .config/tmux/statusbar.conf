# ============================================================
# CATPPUCCIN THEME
# ============================================================
set -g @catppuccin_flavour 'mocha'   # mocha | macchiato | frappe | latte

# ============================================================
# STATUS BAR GENERAL
# ============================================================
set -g status on
set -g status-interval 1
set -g status-justify centre
set -g status-style bg=default,fg=#cdd6f4

# ============================================================
# LEFT STATUS
# ============================================================
# Session name with a nice icon
set -g status-left-length 60
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] 󰓫 #S #[fg=#89b4fa,bg=#313244]#[fg=#cdd6f4,bg=#313244] 󰣇 #H #[fg=#313244,bg=default]"

# ============================================================
# WINDOW STATUS
# ============================================================
# Inactive windows
set -g window-status-format "#[fg=#6c7086,bg=default] #I:#W "

# Active window
set -g window-status-current-format "#[fg=#1e1e2e,bg=#a6e3a1,bold] #I:#W #[fg=#a6e3a1,bg=default]"

# Separator
set -g window-status-separator ""

# ============================================================
# RIGHT STATUS
# ============================================================
set -g status-right-length 100
set -g status-right "#[fg=#45475a,bg=default]#[fg=#cdd6f4,bg=#45475a] 󰃭 %a %d %b #[fg=#6c7086,bg=#45475a]#[fg=#1e1e2e,bg=#6c7086] 󰥔 %H:%M:%S #[fg=#89b4fa,bg=#6c7086]#[fg=#1e1e2e,bg=#89b4fa,bold] 󰒋 #{pane_current_path} "

# ============================================================
# PANE BORDERS (complements the status bar)
# ============================================================
set -g pane-border-style fg=#313244
set -g pane-active-border-style fg=#89b4fa

# ============================================================
# MESSAGE / COMMAND LINE
# ============================================================
set -g message-style bg=#89b4fa,fg=#1e1e2e,bold
set -g message-command-style bg=#313244,fg=#cdd6f4
